<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>업무문서양식</title>
<style>
:root {
  --ink: #1a1a1a;
  --muted: #4a4a4a;
  --line: #c8c8c8;
  --bg: #f4f1ea;
  --paper: #fff;
  --mark: #7a1f1f;
  --ok: #1f5c3a;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  font-size: 15px;
  line-height: 1.55;
}
.wrap { max-width: 920px; margin: 24px auto 64px; padding: 0 16px; }
.paper {
  background: var(--paper);
  border: 1px solid var(--line);
  padding: 28px 32px 40px;
}
.school { font-size: 13px; color: var(--muted); }
h1 { font-size: 22px; margin: 8px 0 6px; }
.sub { color: var(--muted); margin-bottom: 16px; }
table { width: 100%; border-collapse: collapse; margin: 12px 0 20px; }
th, td { border: 1px solid var(--line); padding: 8px 10px; vertical-align: top; text-align: left; }
th { background: #f7f5f0; width: 22%; }
.stamp { width: 100%; max-width: 440px; margin-left: auto; }
.stamp th, .stamp td { text-align: center; height: 52px; }
.status { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0 20px; }
.chip { border: 1px solid var(--line); padding: 4px 10px; font-size: 13px; }
.chip.do { border-color: var(--mark); color: var(--mark); }
.chip.skip { color: var(--muted); }
ol.todo { padding-left: 22px; }
ol.todo li { margin: 8px 0; }
.box { border: 1px solid var(--line); padding: 12px 14px; margin: 12px 0 20px; background: #fbfaf7; }
h2 { font-size: 17px; margin: 28px 0 10px; border-bottom: 2px solid var(--ink); padding-bottom: 4px; }
.nav a { margin-right: 12px; color: var(--mark); }
footer { margin-top: 28px; font-size: 12px; color: var(--muted); }
@media print {
  body { background: #fff; }
  .wrap { margin: 0; max-width: none; padding: 0; }
  .paper { border: none; padding: 0; }
  .noprint { display: none; }
}

</style>
</head>
<body>
<div class="wrap"><div class="paper">
<div class="school">학교명</div>
<h1>(문서 제목 — 공문에 올리는 한글 제목 그대로)</h1>
<p class="sub">문서종류 · 수신 · 날짜</p>
<table class="stamp">
<tr><th>기안</th><th>검토</th><th>결재</th></tr>
<tr><td></td><td></td><td></td></tr>
</table>
<table>
<tr><th>제목</th><td></td></tr>
<tr><th>근거</th><td></td></tr>
<tr><th>내용</th><td></td></tr>
<tr><th>붙임</th><td></td></tr>
</table>

<footer>산출 문서 · 내부 검토용 초안 · 결재선·날짜는 학교 공문 양식에 맞게 옮길 것</footer>
</div></div>
</body>
</html>
